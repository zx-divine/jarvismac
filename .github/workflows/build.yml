name: Apple Silicon tests and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - run: python scripts/audit_source.py
      - run: JARVIS_PYTHON=python bash scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-macos-arm64
          path: dist/JARVIS-macos-arm64.zip
          retention-days: 14
