name: Desktop tests and packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/audit_source.py
      - run: python -m pytest -q
      - run: python scripts/download_voice_model.py
      - run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name JARVIS --collect-all vosk --add-data "models/vosk-model-small-en-us-0.15;models/vosk-model-small-en-us-0.15" run_jarvis.py
      - name: Package launch with no API key or microphone
        shell: pwsh
        run: |
          $env:JARVIS_DATA_DIR = Join-Path $env:RUNNER_TEMP 'jarvis-package-check'
          $process = Start-Process dist/JARVIS/JARVIS.exe -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Package startup timeout' }
          if ($process.ExitCode -ne 0) { throw 'Package startup failed' }
          Get-Content (Join-Path $env:JARVIS_DATA_DIR 'launch-check.json')
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-windows-x64
          path: dist/JARVIS/
          retention-days: 14
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - run: python scripts/audit_source.py
      - run: JARVIS_PYTHON=python bash scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-macos-arm64
          path: dist/JARVIS-macos-arm64.zip
          retention-days: 14
